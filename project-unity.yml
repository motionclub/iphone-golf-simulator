include:
  - project.yml
name: GolfArcadeUnity
projectReferences:
  Unity:
    path: Unity/Builds/iOS/Unity-iPhone.xcodeproj
targets:
  GolfArcade:
    sources:
      - path: Unity/Builds/iOS/Data
        type: folder
        buildPhase: resources
    dependencies:
      - target: Unity/UnityFramework
        embed: true
    settings:
      base:
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        # The App Store build (TestFlight): its team and version live here so xcodegen keeps them.
        DEVELOPMENT_TEAM: 9F65U6SU2W
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: 7
