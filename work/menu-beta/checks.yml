name: MenuBetaChecks
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  GolfArcade:
    type: application
    platform: iOS
    sources:
      - path: /Users/adnanyonathan/Documents/Codex/2026-09-20/wh/outputs/iphone-golf-simulator/work/menu-beta/Source
        excludes: [Unity/SportsInfo.plist, Unity/MenuVideo, "Unity/CharacterAssets/Custom*", "Unity/CharacterAssets/Higgs*", "Unity/CharacterAssets/Hero*", "Unity/CharacterAssets/Player*"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.GolfArcade
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: /Users/adnanyonathan/Documents/Codex/2026-09-20/wh/outputs/iphone-golf-simulator/work/menu-beta/Source/Unity/SportsInfo.plist
        SWIFT_OBJC_BRIDGING_HEADER: /Users/adnanyonathan/Documents/Codex/2026-09-20/wh/outputs/iphone-golf-simulator/work/menu-beta/Source/Unity/GolfArcade-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
  MenuBetaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: /Users/adnanyonathan/Documents/Codex/2026-09-20/wh/outputs/iphone-golf-simulator/GolfArcadeTests/MenuBetaTests.swift
    dependencies:
      - target: GolfArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.MenuBetaTests
        GENERATE_INFOPLIST_FILE: YES
  MenuBetaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: /Users/adnanyonathan/Documents/Codex/2026-09-20/wh/outputs/iphone-golf-simulator/GolfArcadeUITests/MenuBetaUITests.swift
    dependencies:
      - target: GolfArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.MenuBetaUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuBetaChecks:
    build:
      targets:
        GolfArcade: all
        MenuBetaTests: [test]
        MenuBetaUITests: [test]
    test:
      targets: [MenuBetaTests, MenuBetaUITests]
